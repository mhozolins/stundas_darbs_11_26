name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, prod]

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t hello-secret .

      - name: Run Docker container
        env:
          SECRET: ${{ secrets.SECRET }}
        run: docker run --rm -e SECRET hello-secret