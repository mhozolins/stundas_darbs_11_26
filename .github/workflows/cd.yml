name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted, prod]

    steps:
      - uses: actions/checkout@v4

      - name: Run Python
        env:
          SECRET: ${{ secrets.SECRET }}
        run: Start-Process powershell -ArgumentList '-NoExit', '-Command', 'python hello_world.py'